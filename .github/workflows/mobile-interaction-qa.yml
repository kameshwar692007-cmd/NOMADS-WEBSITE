name: Mobile browser interaction QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/verify-mobile-interactions.mjs'
      - '.github/workflows/mobile-interaction-qa.yml'
  workflow_dispatch:
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Confirm Chrome is installed
        run: command -v google-chrome || command -v chromium
      - name: Browser QA at mobile, tablet and desktop sizes
        run: node tests/verify-mobile-interactions.mjs
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
